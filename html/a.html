<body>
<h1>为什么学前端</h1>
<h2>为什么学前端<</h2>
<p>因为前端<strong>好学</strong></p><hr>
<hr>
<p>这是一个段落</p>
<p>这又是一个段落</p>
<p>
  段落里可以放：
  <strong>strong 表示重要内容（加粗，有语义）</strong>，
  <b>b 标签也加粗，但没有语义，只是视觉效果</b>，
  <em>em 表示强调（斜体）</em>，
  <i>i 标签也斜体，纯视觉无强调含义</i>。
</p>
<p>
  还可以标记 <mark>高亮文字</mark>，
  或者 <del>删除的内容</del> <ins>新增的内容</ins>。
</p>

<hr>

</body>
</html>
